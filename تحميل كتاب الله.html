<!DOCTYPE html>
<html lang="ar">
<head>

    <style>
        body {
            background-image: url('background.jpg');
            background-size: cover;

.button {

}
    </style>
</head>
<body>
    <div class="container">
        <img style="border-radius: 15px; width: 70%; height: Auto;" src="Qur'an.jpg" alt="Qur'an" style="max-width: 100%; height: auto;">
<h2 style=" color: white; text-shadow: 0px 1px 1px black;">كتاب الله : الْقُرْآنُ الْكَرِيمُ</h2>
        <a href="الْقُرْآنُ الْكَرِيمُ.pdf" download>

        </a>
    </div>
    <script>
    const link = document.createElement('a');
link.href = 'الْقُرْآنُ الْكَرِيمُ.pdf';
link.download = 'الْقُرْآنُ الْكَرِيمُ.pdf';

    </script>
